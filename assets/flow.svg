<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="How KeyScope works: key stays in the browser, only the models endpoint is called">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0a1c"/>
      <stop offset="1" stop-color="#0a0716"/>
    </linearGradient>
    <filter id="wglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="300" fill="url(#wbg)"/>

  <g font-family="'Segoe UI',system-ui,sans-serif" text-anchor="middle">
    <!-- node 1: browser -->
    <g>
      <rect x="60" y="90" width="240" height="120" rx="20" fill="#8b5cf622" stroke="#8b5cf6" stroke-width="2"/>
      <text x="180" y="140" font-size="22" font-weight="700" fill="#f2efff">Your browser</text>
      <text x="180" y="170" font-size="16" fill="#a49bc9">API key lives here,</text>
      <text x="180" y="192" font-size="16" fill="#a49bc9">memory only</text>
      <g transform="translate(180,118)" opacity="0.9">
        <rect x="-14" y="-12" width="28" height="22" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
        <rect x="-10" y="-8" width="20" height="5" rx="2" fill="#a78bfa"/>
      </g>
    </g>

    <!-- node 2: https -->
    <g>
      <rect x="400" y="90" width="240" height="120" rx="20" fill="#22d3ee18" stroke="#22d3ee" stroke-width="2"/>
      <text x="520" y="140" font-size="22" font-weight="700" fill="#f2efff">HTTPS</text>
      <text x="520" y="170" font-size="16" fill="#a49bc9">encrypted in transit</text>
      <g transform="translate(520,112)" stroke="#67e8f9" stroke-width="2.5" fill="none">
        <rect x="-12" y="-10" width="24" height="20" rx="5"/>
        <path d="M-7,-2 a7,7 0 0 1 14,0"/>
      </g>
    </g>

    <!-- node 3: /models -->
    <g>
      <rect x="740" y="90" width="240" height="120" rx="20" fill="#ec489918" stroke="#ec4899" stroke-width="2"/>
      <text x="860" y="140" font-size="22" font-weight="700" fill="#f2efff">/v1/models</text>
      <text x="860" y="170" font-size="16" fill="#a49bc9">OpenAI-compatible</text>
      <text x="860" y="192" font-size="16" fill="#a49bc9">endpoint</text>
      <text x="860" y="118" font-size="15" fill="#f9a8d4" font-family="ui-monospace,Menlo,monospace">GET → list</text>
    </g>

    <!-- node 4: result -->
    <g>
      <rect x="1080" y="90" width="140" height="120" rx="20" fill="#34d39918" stroke="#34d399" stroke-width="2" filter="url(#wglow)">
        <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="1150" y="140" font-size="20" font-weight="700" fill="#f2efff">Model</text>
      <text x="1150" y="164" font-size="20" font-weight="700" fill="#f2efff">list ✓</text>
      <text x="1150" y="192" font-size="15" fill="#a49bc9">search · copy</text>
    </g>

    <!-- animated connectors -->
    <g stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="300" y1="150" x2="400" y2="150" stroke="#8b5cf6" stroke-dasharray="10 8">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="640" y1="150" x2="740" y2="150" stroke="#22d3ee" stroke-dasharray="10 8">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      </line>
      <line x1="980" y1="150" x2="1080" y2="150" stroke="#ec4899" stroke-dasharray="10 8">
        <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- footer note -->
    <text x="640" y="262" font-size="19" fill="#a49bc9">Nothing is stored, nothing is sent anywhere else — close the tab and the key is gone.</text>
  </g>
</svg>
