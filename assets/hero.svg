<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="KeyScope — API key model explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0716"/>
      <stop offset="0.55" stop-color="#120c26"/>
      <stop offset="1" stop-color="#0a0716"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="titleClip">
      <text x="640" y="196" text-anchor="middle" font-size="118" font-weight="800"
            font-family="ui-rounded,'Baloo 2','Segoe UI',system-ui,sans-serif" letter-spacing="2">KeyScope</text>
    </clipPath>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1280" height="430" fill="url(#bg)"/>
  <rect width="1280" height="430" fill="url(#dots)"/>

  <!-- drifting aurora orbs -->
  <ellipse cx="220" cy="90" rx="300" ry="180" fill="url(#orbV)" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 130 50; 0 0" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1080" cy="330" rx="320" ry="190" fill="url(#orbP)" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -150 -40; 0 0" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="640" cy="430" rx="380" ry="170" fill="url(#orbC)" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 -30; 0 0" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- scope rings, right side (nod to the rotating halo) -->
  <g transform="translate(1070,150)" opacity="0.9">
    <circle r="118" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5"/>
    <circle r="92" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
    <circle r="66" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
    <g>
      <circle cx="0" cy="-92" r="7" fill="#f472b6" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-66" r="5.5" fill="#67e8f9" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </g>
    <circle r="118" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.9">
      <animate attributeName="r" values="118;130;118" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- keyhole dot -->
    <circle r="10" fill="#f2efff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <text x="620" y="196" text-anchor="middle" font-size="118" font-weight="800"
        font-family="ui-rounded,'Baloo 2','Segoe UI',system-ui,sans-serif" letter-spacing="2"
        fill="url(#titleGrad)" filter="url(#glow)">KeyScope</text>
  <!-- shine sweep -->
  <g clip-path="url(#titleClip)">
    <rect x="-260" y="40" width="260" height="220" fill="url(#shine)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1400 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tagline, staggered reveal -->
  <g font-family="'Segoe UI',system-ui,sans-serif" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
      <text x="620" y="248" font-size="30" fill="#f2efff" font-weight="600">Point it at any OpenAI-compatible API</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.8s" fill="freeze"/>
      <text x="620" y="288" font-size="30" fill="#a49bc9">and see every model your key can call.</text>
    </g>
  </g>

  <!-- floating model chips -->
  <g font-family="ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17">
    <g>
      <rect x="180" y="300" width="248" height="40" rx="20" fill="#8b5cf622" stroke="#8b5cf6" opacity="0.95"/>
      <text x="304" y="326" text-anchor="middle" fill="#c4b5fd">gemini-3.8-flash</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="470" y="318" width="196" height="40" rx="20" fill="#ec489922" stroke="#ec4899" opacity="0.95"/>
      <text x="568" y="344" text-anchor="middle" fill="#f9a8d4">claude-sonnet-5</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="6.5s" begin="-2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="706" y="300" width="180" height="40" rx="20" fill="#22d3ee22" stroke="#22d3ee" opacity="0.95"/>
      <text x="796" y="326" text-anchor="middle" fill="#a5f3fc">gpt-5.4-mini</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -20; 0 0" dur="5.8s" begin="-1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- CTA pill -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.8s" fill="freeze"/>
    <rect x="500" y="368" width="280" height="46" rx="23" fill="#0d0a1c" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="640" y="397" text-anchor="middle" font-size="20" font-weight="700" fill="#f2efff"
          font-family="'Segoe UI',system-ui,sans-serif">keyscope.funapp.live</text>
  </g>

  <!-- blinking cursor -->
  <rect x="906" y="266" width="14" height="30" fill="#f472b6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
