<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="KeyScope features: search, copy, privacy">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0716"/>
      <stop offset="1" stop-color="#100b22"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff14"/>
      <stop offset="1" stop-color="#ffffff06"/>
    </linearGradient>
    <filter id="fglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#fbg)"/>

  <g font-family="'Segoe UI',system-ui,sans-serif">
    <!-- CARD 1: search -->
    <g>
      <rect x="40" y="40" width="380" height="320" rx="24" fill="url(#cardG)" stroke="#8b5cf655" stroke-width="1.5"/>
      <g transform="translate(110,130)">
        <circle r="44" fill="none" stroke="#8b5cf6" stroke-width="3"/>
        <circle r="30" fill="none" stroke="#8b5cf688" stroke-width="2"/>
        <circle r="16" fill="none" stroke="#8b5cf655" stroke-width="2"/>
        <circle r="4" fill="#a78bfa" filter="url(#fglow)"/>
        <g opacity="0.85">
          <line x1="0" y1="0" x2="0" y2="-44" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
          <circle cx="0" cy="-36" r="5" fill="#f472b6" filter="url(#fglow)"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        </g>
      </g>
      <text x="230" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#f2efff">Instant search &amp; filter</text>
      <text x="230" y="266" text-anchor="middle" font-size="18" fill="#a49bc9">Type to find any model</text>
      <text x="230" y="294" text-anchor="middle" font-size="18" fill="#a49bc9">in milliseconds.</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
        <circle cx="150" cy="92" r="5" fill="#f472b6" filter="url(#fglow)"/>
      </g>
    </g>

    <!-- CARD 2: copy & download -->
    <g>
      <rect x="450" y="40" width="380" height="320" rx="24" fill="url(#cardG)" stroke="#ec489955" stroke-width="1.5"/>
      <g transform="translate(600,130)" stroke="#f472b6" stroke-width="3" fill="none">
        <rect x="-34" y="-22" width="56" height="66" rx="8"/>
        <rect x="-16" y="-38" width="56" height="66" rx="8" fill="#0d0a1c"/>
        <line x1="-4" y1="-22" x2="28" y2="-22" stroke-linecap="round">
          <animate attributeName="x2" values="28;4;28" dur="2.4s" repeatCount="indefinite"/>
        </line>
        <line x1="-4" y1="-10" x2="20" y2="-10" stroke-linecap="round" opacity="0.7"/>
        <line x1="-4" y1="2" x2="24" y2="2" stroke-linecap="round" opacity="0.7"/>
      </g>
      <text x="640" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#f2efff">One-tap copy &amp; download</text>
      <text x="640" y="266" text-anchor="middle" font-size="18" fill="#a49bc9">Copy any model ID, or grab</text>
      <text x="640" y="294" text-anchor="middle" font-size="18" fill="#a49bc9">the full list as JSON.</text>
    </g>

    <!-- CARD 3: private -->
    <g>
      <rect x="860" y="40" width="380" height="320" rx="24" fill="url(#cardG)" stroke="#22d3ee55" stroke-width="1.5"/>
      <g transform="translate(1050,130)">
        <circle r="52" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.8">
          <animate attributeName="r" values="52;62;52" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="52" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5">
          <animate attributeName="r" values="52;62;52" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
        </circle>
        <path d="M-22,-6 a22,22 0 0 1 44,0 v10 h-44 z M-28,-6 h56 v34 a6,6 0 0 1 -6,6 h-44 a6,6 0 0 1 -6,-6 z"
              fill="#22d3ee33" stroke="#67e8f9" stroke-width="3"/>
        <circle cx="0" cy="12" r="5" fill="#67e8f9" filter="url(#fglow)"/>
        <line x1="0" y1="12" x2="0" y2="22" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text x="1050" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#f2efff">Private by design</text>
      <text x="1050" y="266" text-anchor="middle" font-size="18" fill="#a49bc9">Your key never leaves</text>
      <text x="1050" y="294" text-anchor="middle" font-size="18" fill="#a49bc9">this browser tab.</text>
    </g>
  </g>
</svg>
